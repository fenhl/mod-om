[package]
name = "mod-om"
version = "0.1.10"
edition = "2024"
rust-version = "1.95" # nixpkgs stable

[workspace.lints.rust]
rust_2018_idioms = "deny"
unsafe_code = "forbid"
unused = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
warnings = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dependencies]
async-tempfile = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
gix = { version = "0.89", features = ["blocking-http-transport-reqwest"] }
itertools = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["charset", "gzip", "hickory-dns", "http2", "rustls-no-provider", "system-proxy", "zstd"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = { package = "serde_json_path_to_error", version = "0.1" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "parking_lot"] }
wheel = { git = "https://github.com/fenhl/wheel", features = ["github", "serde_json"] }
which = "8"
zip = "9"
